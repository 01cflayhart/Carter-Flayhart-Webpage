name: Review and archive sports analysis daily
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: sports-analysis-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_sports -v
      - name: Refresh sources, evaluate frozen forecasts and publish boards
        run: python -m sports.daily
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_DAILY_CREDITS: '6'
          SPORTS_INPUT_URL: ${{ secrets.SPORTS_INPUT_URL }}
          SPORTS_INPUT_TOKEN: ${{ secrets.SPORTS_INPUT_TOKEN }}
      - name: Commit public archives and daily reviews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/sports/analysis
          if ! git diff --cached --quiet; then
            git commit -m 'Update sports model coverage and daily review'
            git pull --rebase origin main
            git push
          fi
      - name: Publish updated website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run cloudflare.yml --ref main
