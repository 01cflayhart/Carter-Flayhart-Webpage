name: Publish to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '53 */6 * * *'
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check deployment authorization
        id: configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DATABASE: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$CF_DATABASE" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment awaits CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and repository variable CLOUDFLARE_D1_DATABASE_ID; no deploy attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Configure production database binding
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/configure-cloudflare.cjs
      - name: Retrieve current tennis results and build
        if: steps.configured.outputs.ready == 'true'
        run: |
          python -m unittest discover -q
          node --test tests/security.test.mjs
          python -m tennis.current
          python -m tennis.export
      - name: Apply pending analytics database migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 migrations apply carter-site-activity --remote --config wrangler.jsonc
      - name: Deploy static assets and protected Pages Functions
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy _site --project-name carterflayhart --branch main
