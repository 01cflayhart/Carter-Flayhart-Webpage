name: Refresh CV and published tennis rankings
on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: website-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read the live Overleaf CV and preserve the last PDF on failure
        id: cv
        continue-on-error: true
        run: node scripts/refresh-cv.cjs
      - name: Refresh dated ATP and WTA ranking editions independently
        run: python -m tennis.official
      - name: Prepare identity candidates from licensed result IDs
        run: python -m tennis.identities
      - name: Verify new player links against independent public profiles
        run: node scripts/refresh-tennis-identities.cjs
      - name: Commit public snapshots and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add site/assets/carter-flayhart-cv.pdf site/sports/tennis/official-rankings.json site/sports/tennis/identities.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh CV and published tennis rankings'
            # Other scheduled jobs or edits may have landed during the browser
            # refresh. Rebase only this bot commit; never force-push over them.
            git pull --rebase origin main
            git push
            gh workflow run pages.yml --ref main
            gh workflow run cloudflare.yml --ref main
          fi
      - name: Report CV refresh failure
        if: steps.cv.outcome == 'failure'
        run: echo '::warning::The CV could not be refreshed; the last valid PDF remains published.'
